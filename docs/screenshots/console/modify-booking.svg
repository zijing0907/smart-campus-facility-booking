<text x="22" y="70"><tspan fill="#39c5cf" font-weight="bold">--- MODIFY BOOKING ------------------------------------</tspan></text>
<text x="22" y="89"><tspan fill="#39c5cf">  [i]   Only PENDING bookings can be modified.</tspan></text>
<text x="22" y="108">  <tspan fill="#e3b341">[0]</tspan> Back</text>
<text x="22" y="127">  <tspan fill="#e3b341">[1]</tspan> BK0012 — Tutorial Room K209 — 30/11/2026 15:00-16:00</text>
<text x="22" y="146">  <tspan fill="#e3b341">[2]</tspan> BK0013 — Lecture Theatre KG01 — 25/11/2026 14:00-16:00</text>
<text x="22" y="165"><tspan fill="#e3b341">  Select booking (0-2): </tspan>2</text>
<text x="22" y="184"></text>
<text x="22" y="203"><tspan fill="#39c5cf">  [i]   Press ENTER to keep current value.</tspan></text>
<text x="22" y="222"><tspan fill="#e3b341">  New date [25/11/2026]: </tspan></text>
<text x="22" y="241"><tspan fill="#e3b341">  New start time [14:00]: </tspan></text>
<text x="22" y="260"><tspan fill="#e3b341">  New end time [16:00]: </tspan>16:30</text>
<text x="22" y="279"><tspan fill="#e3b341">  New description [Java programming revision]: </tspan></text>
<text x="22" y="298"><tspan fill="#e3b341">  New number of people [35]: </tspan>6</text>
<text x="22" y="317"><tspan fill="#3fb950">  [OK]  Booking updated successfully.</tspan></text>
<text x="22" y="336"></text>
<text x="22" y="355"><tspan fill="#e3b341">  Press ENTER to continue...</tspan></text>
