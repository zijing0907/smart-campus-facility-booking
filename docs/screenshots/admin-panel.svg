<text x="22" y="70"><tspan fill="#39c5cf" font-weight="bold">+============================================================+</tspan></text>
<text x="22" y="89"><tspan fill="#39c5cf" font-weight="bold">|              UTAR SMART CAMPUS — ADMIN PANEL               |</tspan></text>
<text x="22" y="108"><tspan fill="#39c5cf" font-weight="bold">+============================================================+</tspan></text>
<text x="22" y="127"></text>
<text x="22" y="146">  <tspan fill="#39c5cf">Admin:</tspan>           <tspan fill="#f0f6fc">Admin Office</tspan></text>
<text x="22" y="165"></text>
<text x="22" y="184"></text>
<text x="22" y="203"><tspan fill="#39c5cf" font-weight="bold">--- BOOKING MANAGEMENT --------------------------------</tspan></text>
