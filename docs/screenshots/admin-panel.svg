<text x="22" y="279"></text>
<text x="22" y="298"><tspan fill="#39c5cf" font-weight="bold">--- MAINTENANCE MANAGEMENT ----------------------------</tspan></text>
<text x="22" y="317">  <tspan fill="#e3b341">[4]</tspan> View All Maintenance Reports</text>
